<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintrend Studio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<h1>Vintrend Studio</h1>
<p>Préparez vos photos d'article : détourage, fond et lumière, tout se passe sur votre téléphone, hors ligne.</p>
<p><a href="./capture.html">Prendre une photo guidée</a></p>
<div id="banner" hidden>
  <p id="banner-msg"></p>
  <button id="banner-btn" type="button">Télécharger le modèle</button>
  <progress id="banner-bar" max="1" value="0" hidden></progress>
</div>
<main id="app">
  <p id="status" role="status" aria-live="polite"></p>
  <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
  <p id="model"></p>
  <p id="model-note" class="note" role="status" aria-live="polite"></p>
  <input id="pick" type="file" accept="image/*" multiple hidden>
  <p class="row">
    <button id="pick-btn" type="button">Choisir des photos</button>
    <button id="resume" type="button" hidden>Traiter les photos</button>
  </p>
  <div id="list"></div>
  <fieldset id="settings">
    <legend>Réglages de la série</legend>
    <label>Fond
      <select id="bg">
        <option value="auto">Auto</option>
        <option value="blanc">Blanc cassé</option>
        <option value="gris">Gris clair</option>
        <option value="beige">Beige clair</option>
      </select>
    </label>
    <label>Ombre
      <select id="shadow">
        <option value="none">Aucune</option>
        <option value="light">Légère</option>
        <option value="normal" selected>Normale</option>
      </select>
    </label>
    <label>Luminosité <output id="ev-out">Auto</output>
      <input id="ev" type="range" min="-0.7" max="0.7" step="0.1" value="0">
    </label>
    <button id="ev-auto" type="button" class="ghost">Luminosité auto</button>
    <label class="check"><input id="face" type="checkbox"> Masquer le visage (photos Porté)</label>
  </fieldset>
  <div id="actions" hidden>
    <p id="blocked" class="bad"></p>
    <p class="row">
      <button id="save" type="button" disabled>Enregistrer</button>
      <button id="share" type="button" disabled>Partager</button>
    </p>
    <p class="hint">Gardez au moins une photo des défauts en Lumière seule.</p>
    <p><button id="new" type="button" class="ghost">Nouvel article</button></p>
  </div>
</main>
<script type="module" src="./app.js"></script>
<script type="module">
import { fetchBytes } from './lib/models.js';

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { type: 'module' }).catch(() => {});
navigator.storage?.persist?.().catch(() => {});

// Point de vigilance 5 : iOS peut effacer le cache du modèle. On le vérifie à chaque lancement.
const $ = (id) => document.getElementById(id);
(async () => {
  const cfg = await (await fetch('./models.json')).json();
  const m = cfg.models[cfg.default];
  if (!m?.files.length) return;
  const urls = m.files.map((f) => new URL(`./models/${f}`, location.href).href);
  const cached = await Promise.all(urls.map((u) => caches.match(u)));
  if (cached.every(Boolean)) return;
  const mo = Math.round(m.sizes.reduce((a, b) => a + b, 0) / 1e6);
  $('banner').hidden = false;
  const msg = () => { $('banner-msg').textContent = navigator.onLine ? `modèle à re-télécharger (${mo} Mo)` : 'Connexion nécessaire pour télécharger le modèle. Le mode Lumière seule reste disponible.'; $('banner-btn').disabled = !navigator.onLine; };
  msg(); addEventListener('online', msg); addEventListener('offline', msg);
  $('banner-btn').onclick = async () => {
    $('banner-btn').disabled = true; $('banner-bar').hidden = false;
    try {
      await fetchBytes(urls, m.sizes, (got, total) => { $('banner-bar').value = got / total; });   // octets seulement : la session est créée par app.js getMask, sous le drapeau vsSeg
      $('banner').hidden = true;
    } catch (e) { $('banner-msg').textContent = 'Échec du téléchargement : ' + (e.message || e); $('banner-btn').disabled = false; }
  };
})().catch((e) => { $('banner').hidden = false; $('banner-btn').hidden = true; $('banner-msg').textContent = 'Impossible de vérifier le modèle : ' + (e.message || e); });
</script>
</body>
</html>
