<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintrend Studio - photo guidée</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<style>
  #modes { display: flex; gap: 8px; margin: 8px 0; }
  #modes button { flex: 1; background: transparent; color: var(--fg); border: 2px solid var(--accent); }
  #modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #guide { font-size: .9rem; margin: 8px 0; }
  /* le cadre tient dans 55 % de la hauteur visible (largeur = 0,75 x hauteur) : conseils et déclencheur restent à l'écran */
  #stage { position: relative; aspect-ratio: 3 / 4; width: min(100%, 480px, 41vh); width: min(100%, 480px, 41dvh); margin: 8px auto; background: #000; border-radius: 8px; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #level { position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: .85rem; }
  #level.ok { background: #1b7f4b; }
  #state { position: absolute; bottom: 8px; left: 8px; right: 8px; text-align: center; color: #fff; text-shadow: 0 0 4px #000; }
  #tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  #zoom { display: flex; gap: 8px; }
  #tools button[aria-pressed="true"] { outline: 3px solid var(--fg); }
  #advice { list-style: none; padding: 0; margin: 8px 0; }
  #advice li { padding: 6px 10px; margin: 4px 0; border-radius: 8px; border: 1px solid #c77; }
  #advice li.soft { border-color: #ca3; }
  #shutter { display: block; margin: 12px auto; padding: 14px 32px; position: sticky; bottom: 8px; }
  body:has(#live:not([hidden])) :is(h1, #guide) { display: none; } /* le guide a servi avant le démarrage : la place va à l'image */
  #fallback { margin: 12px 0; padding: 12px; border: 1px solid var(--accent); border-radius: 8px; }
  #debug { font-size: 11px; white-space: pre-wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Photo guidée</h1>
<div id="modes">
  <button type="button" data-mode="flat" aria-pressed="true">À plat</button>
  <button type="button" data-mode="upright" aria-pressed="false">Porté</button>
</div>
<p id="guide"></p>
<button id="start" type="button">Démarrer la caméra</button>
<p id="msg" role="status"></p>
<div id="fallback" hidden>
  <label>Appareil photo du téléphone (sans aide en direct) :
    <input id="file" type="file" accept="image/*" capture="environment">
  </label>
</div>
<div id="live" hidden>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <span id="level" hidden></span>
    <div id="state"></div>
  </div>
  <div id="tools">
    <span id="zoom" hidden></span>
    <button id="switch" type="button" hidden>Changer de caméra</button>
  </div>
  <ul id="advice"></ul>
  <button id="shutter" type="button">Prendre la photo</button>
  <pre id="debug" hidden></pre>
</div>
<p><a href="./">Retour</a></p>
<script type="module" src="./capture.js"></script>
</body>
</html>
